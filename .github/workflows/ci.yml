name: CI

on:
  push:
  pull_request:

jobs:
  safe-health:
    name: Repo Hygiene and Safe Health
    runs-on: ubuntu-latest
    env:
      ENABLE_PAID_ANALYSIS: "false"
      ENABLE_AUTO_BACKFILL: "false"
      BACKFILL_DRY_RUN_DEFAULT: "true"
      MAX_BACKFILL_LLM_CALLS: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install canonical backend test environment
        run: python -m pip install -r requirements-test.txt

      - name: Test-environment preflight
        run: python scripts/test_environment_preflight.py --json

      - name: Run repo hygiene unit tests
        run: python -m unittest tests.test_repo_hygiene_check -v

      - name: Run repo hygiene guard
        run: python scripts/repo_hygiene_check.py --json

      - name: Run pure statistical utility tests
        run: |
          python -m unittest tests.test_event_study -v
          python -m unittest tests.test_bootstrap_ci -v
          python -m unittest tests.test_fdr -v
          python -m unittest tests.test_stat_validation -v

      - name: Run synthetic statistical validation smoke
        run: |
          python - <<'PY'
          import json

          from stats.bootstrap_ci import bootstrap_ar_ci, bootstrap_sar_ci
          from stats.event_study import compute_event_study
          from stats.fdr import bh_adjust
          from stats.stat_validation import compose_validation_records

          asset_prices = [
              100.0 + (idx * 0.21) + ((idx % 7) * 0.03)
              for idx in range(90)
          ]
          benchmark_prices = [
              100.0 + (idx * 0.16) + ((idx % 5) * 0.02)
              for idx in range(90)
          ]

          study = compute_event_study(
              asset_prices=asset_prices,
              benchmark_prices=benchmark_prices,
              event_index=65,
              horizons=(1, 5, 20),
              estimation_window=60,
          )
          if not study["available"]:
              raise SystemExit("synthetic event study unexpectedly unavailable")

          rows = []
          abnormal_returns = []
          sar_values = []
          p_values = [0.01, 0.03, 0.20]
          fdr = bh_adjust(p_values, alpha=0.05)

          for idx, horizon in enumerate((1, 5, 20)):
              horizon_result = study["horizons"][horizon]
              ar = horizon_result["abnormal_return"]
              sar = horizon_result["sar"]
              if ar is None or sar is None:
                  raise SystemExit(
                      f"synthetic horizon {horizon} returned incomplete stats"
                  )
              abnormal_returns.append(ar)
              sar_values.append(sar)
              rows.append(
                  {
                      "horizon": horizon,
                      "abnormal_return": ar,
                      "sar": sar,
                      "ci_low": None,
                      "ci_high": None,
                      "p_value": p_values[idx],
                      "fdr_q": fdr["adjusted"][idx],
                  }
              )

          ar_ci = bootstrap_ar_ci(
              abnormal_returns,
              n_bootstrap=200,
              seed=7,
              min_samples=3,
          )
          sar_ci = bootstrap_sar_ci(
              sar_values,
              n_bootstrap=200,
              seed=7,
              min_samples=3,
          )
          if not ar_ci["ok"] or not sar_ci["ok"]:
              raise SystemExit("synthetic bootstrap CI unexpectedly unavailable")

          records = compose_validation_records(rows, alpha=0.05)
          if len(records) != 3 or fdr["num_discoveries"] < 1:
              raise SystemExit("synthetic statistical validation smoke failed")

          print(
              json.dumps(
                  {
                      "ok": True,
                      "records": len(records),
                      "fdr_discoveries": fdr["num_discoveries"],
                      "ar_ci": {
                          "lower": ar_ci["lower"],
                          "upper": ar_ci["upper"],
                      },
                      "sar_ci": {
                          "lower": sar_ci["lower"],
                          "upper": sar_ci["upper"],
                      },
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Build runner-local health fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import sqlite3

          import db

          def ensure_price_cache(path: str) -> None:
              with sqlite3.connect(path) as conn:
                  conn.execute(
                      "CREATE TABLE IF NOT EXISTS price_cache ("
                      "ticker TEXT NOT NULL, "
                      "date TEXT NOT NULL, "
                      "close REAL, "
                      "volume REAL, "
                      "auto_adjust INTEGER DEFAULT 1, "
                      "PRIMARY KEY (ticker, date, auto_adjust))"
                  )
                  conn.execute(
                      "INSERT OR IGNORE INTO price_cache "
                      "(ticker, date, close, volume, auto_adjust) "
                      "VALUES ('SPY', '2026-05-01', 100.0, 1.0, 1)"
                  )
                  conn.commit()

          Path("ci_tmp/backups").mkdir(parents=True, exist_ok=True)

          db.DB_FILE = "ci_tmp/events.db"
          db.init_db()
          with sqlite3.connect(db.DB_FILE) as conn:
              conn.execute(
                  "INSERT INTO events "
                  "(timestamp, headline, stage, persistence, market_tickers, event_date) "
                  "VALUES (?, ?, ?, ?, ?, ?)",
                  (
                      "2026-05-01T00:00:00",
                      "CI fixture event",
                      "initial",
                      "short",
                      '[{"symbol":"SPY"}]',
                      "2026-05-01",
                  ),
              )
              conn.commit()
          ensure_price_cache(db.DB_FILE)
          shutil.copy2(db.DB_FILE, "ci_tmp/backups/events-20260507T000000.db")

          db.DB_FILE = "events.db"
          db.init_db()
          ensure_price_cache(db.DB_FILE)
          PY

      - name: Run safe auto-adjust repair dry-run status
        run: python scripts/auto_adjust_mismatch_repair_preview.py --json

      - name: Run safe auto-adjust consistency check
        run: python scripts/auto_adjust_mismatch_consistency_check.py --json

      - name: Run safe auto-adjust temp-copy smoke
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          cmd = [
              sys.executable,
              "scripts/auto_adjust_mismatch_repair_write_smoke.py",
              "--backup-path",
              "ci_tmp/backups/events-20260507T000000.db",
              "--live-db",
              "ci_tmp/events.db",
              "--json",
          ]
          proc = subprocess.run(
              cmd,
              capture_output=True,
              check=False,
              text=True,
          )
          if proc.stdout:
              print(proc.stdout, end="")
          if proc.stderr:
              print(proc.stderr, end="", file=sys.stderr)

          try:
              payload = json.loads(proc.stdout)
          except json.JSONDecodeError:
              raise SystemExit(proc.returncode or 1)

          errors = payload.get("errors") or []
          writer_missing = (
              proc.returncode == 1
              and payload.get("live_db_unchanged") is True
              and len(errors) == 1
              and errors[0].startswith("writer not implemented yet:")
          )
          if proc.returncode and not writer_missing:
              raise SystemExit(proc.returncode)
          PY

      - name: Run safe no-forward gap report
        run: python scripts/no_forward_20d_gap_report.py --json

      - name: Run safe no-forward refreshability export
        run: python scripts/no_forward_20d_refreshability_export.py --json --limit 100

      - name: Run safe project health
        run: >-
          python scripts/project_health_check.py --json
          --repo-path .
          --db-path ci_tmp/events.db
          --backup-dir ci_tmp/backups
          --allow-duplicate-clusters 28

      - name: Run evidence-layer tests
        run: >-
          python -m unittest -v
          tests.test_validate_phase2_pool
          tests.test_cohort_evidence
          tests.test_validate_rejection_log_summary
          tests.test_validate_cohort_integration_review
          tests.test_tracked_evidence

      - name: Run published evidence-contract tests
        run: >-
          python -m unittest -v
          tests.test_mission_g_evidence
          tests.test_mission_i_evidence
          tests.test_mission_j_evidence
          tests.test_get_provider_boundary
          tests.test_admin_guard
          tests.test_track_record_reproduction_safety
          tests.test_ci_workflow_contract

      - name: Run evidence-layer validators on tracked artifacts
        run: |
          python scripts/validate_freeze_candidate_artifact.py \
              --artifact evidence_artifacts/section_c_v2/freeze_candidate_evidence.json --json
          python scripts/validate_phase2_pool.py \
              --artifact evidence_artifacts/section_c_v2/phase2_pool_v1.json --json
          python scripts/validate_rejection_log_summary.py \
              --artifact evidence_artifacts/section_c_v2/rejection_log_summary_v1.json --json

      - name: Assert evidence_layer pinned counts in project health
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          cmd = [
              sys.executable,
              "scripts/project_health_check.py",
              "--json",
              "--repo-path", ".",
              "--db-path", "ci_tmp/events.db",
              "--backup-dir", "ci_tmp/backups",
              "--allow-duplicate-clusters", "28",
          ]
          proc = subprocess.run(
              cmd, capture_output=True, check=True, text=True,
          )
          payload = json.loads(proc.stdout)

          if payload.get("ok") is not True:
              raise SystemExit(
                  f"project_health_check ok={payload.get('ok')!r}; "
                  f"errors={payload.get('errors')!r}"
              )

          section = payload.get("evidence_layer") or {}
          if section.get("ok") is not True:
              raise SystemExit(
                  f"evidence_layer ok={section.get('ok')!r}; "
                  f"section={section!r}"
              )

          cohort = section.get("cohort_evidence") or {}
          expected = {
              "phase1_count":      5,
              "phase2_count":      5,
              "phase2_pass_count": 3,
              "phase2_fail_count": 2,
              "deferred_count":    3,
          }
          mismatches = {
              k: {"got": cohort.get(k), "expected": v}
              for k, v in expected.items()
              if cohort.get(k) != v
          }
          if mismatches:
              raise SystemExit(
                  f"evidence_layer.cohort_evidence count mismatches: "
                  f"{mismatches!r}"
              )

          print(json.dumps(
              {"ok": True, "cohort_evidence": cohort},
              sort_keys=True,
          ))
          PY

      - name: Run no-paid smoke
        run: python scripts/no_paid_smoke.py --json

  frontend-evidence:
    name: Frontend Evidence Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend workspace
        run: npm ci

      - name: Run frontend evidence suites
        run: npm test

      - name: Typecheck and build
        run: npm run build
