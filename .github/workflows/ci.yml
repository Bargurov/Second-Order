name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      ANALYSIS_PROVIDER: anthropic
      BACKFILL_PROVIDER: anthropic
      ANTHROPIC_API_KEY: dummy-ci-key
      OPENAI_API_KEY: dummy-ci-key
      BACKFILL_MODEL: claude-haiku-4-5-20251001
      MAX_BACKFILL_LLM_CALLS: "1"
      BACKFILL_DRY_RUN_DEFAULT: "true"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused backend tests
        run: python -m unittest tests.test_backfill_paid_guard tests.test_headline_registry tests.test_today_movers_time_window tests.test_market_context_consumer -v

      - name: Run Phase 0 hardening tests
        run: python -m unittest tests.test_diagnostics tests.test_logging_config -v

      - name: Run Phase 1 pure-logic tests
        run: python -m unittest tests.test_validation_status tests.test_reaction_profile -v

      - name: Run auto-backfill foundation tests
        run: python -m unittest tests.test_auto_backfill_ledger tests.test_auto_backfill_planner tests.test_auto_backfill_policy tests.test_auto_backfill_state -v

      - name: Run event archive tests
        run: python -m unittest discover -s tests -p "test_events*.py" -v

      - name: Run no-paid smoke script
        run: python scripts/no_paid_smoke.py --json

      - name: Check archive backup dry run
        run: python scripts/backup_archive.py --dry-run

  frontend:
    name: Frontend Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Build frontend
        run: npm --prefix frontend run build
