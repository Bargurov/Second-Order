  cohort_ready: false                 # WFC/TMUS pins resolved (M13); only the non-blocking BFH anchor + per-row h1-macro confirmation remain before the first returns/validation gate
  conclusion: >-
    Regulation is a genuinely CROSSED-SIGN second-order family: the same
    mechanism produces clean positives (prudential relief, a vacated fee rule,
    antitrust-block relief for an acquirer, a proposed rule repeal) and clean
    negatives (a tougher capital proposal, a fee cap, a drug-price-negotiation
    listing, a stricter emissions rule) on well-defined single-name US-listed
    tickers across six distinct sectors (the M3 state; M5 lifted this to eleven,
    M7 trimmed it back to nine -- see the M5/M7 UPDATEs below).  That breaks the
    one-sector-collapse
    failure of the tariff funnel (steel) and of a supply_shock funnel (this
    codebase's _ticker_sector folds all commodities into ONE channel).  M3
    official-source verification CONFIRMED all 13 datable event dates (no recalled
    date was wrong) but moved the effective N DOWN, not up: (1) k-reg-10 / HUM
    was reclassified to excluded because no single CMS rate notice gives a clean,
    correctly-signed read (the Jan-31 Advance Notice window is contaminated by
    Humana's Jan-25 non-regulatory guidance withdrawal; the ~Apr-1 Final Notice
    is not cleanly negative versus the Advance baseline) -- a source/sourcing
    judgment, no returns used; (2) three sectors (banking, consumer finance,
    coal/power) each carry a temporally-separated crossed-sign PAIR, so they are
    ~1.5 effective shocks apiece, not 2; (3) a Spring-2024 cluster (k-reg-03
    consumer-finance, k-reg-06 coal, k-reg-04 consumer-finance) still has
    overlapping 20-day windows; (4) MACRO PROXIMITY: several included event/h1
    windows straddle a macro print (k-reg-01 GDP/PCE, k-reg-02 CPI + Sep FOMC,
    k-reg-06 Q1-GDP/PCE, k-reg-08 CPI, k-reg-11 CPI) -> read h1-only per
    PHASE_K_EVIDENCE §6 and confirm h1 is clean of same-day macro at validation.
    So at the M3 state the effective N was ~6, BELOW the n>=8 floor (M5 then
    lifted it -- see the M5 UPDATE below).  POSITIVE-LEG ASYMMETRY: ALL FIVE
    positives are relief / reversal reads -- regulatory-relief (JPM softening,
    BFH injunction, BTU proposed repeal) or acquirer-relief (KR, JBLU); there is
    NO pure "a regulator acted to directly help this name" positive in the set,
    and the 2 acquirer-relief reads (KR, JBLU) additionally rest on a contestable
    direction.  Kept as flagged includes, but a pooled read inherits this
    asymmetry.
    FIRST-ORDER vs SECOND-ORDER coherence: every included read is the market
    pricing a DOWNSTREAM consequence (future ROE / fee revenue / Medicare revenue
    / coal demand / competitive structure), the SAME kind of read as tariff (a
    competitor's cost change) and sanction (a supplier's access change); the
    mechanically-priced first-order cases — FDA product approvals and merger-arb
    target spreads — are EXCLUDED on purpose (k-reg-14, k-reg-15).  Resolve
    before any cohort FDR via one of: (a) pin the remaining first_trading_date /
    intraday timings and confirm each h1 is macro-clean; (b) source a few more
    temporally-ISOLATED regulation events (ideally pre-2023) to lift effective N
    clear of 8; (c) sector-relative benchmarks per included row while accepting
    the low effective N.
    M5 UPDATE (2026-06-04, read-only official-source sourcing): added SIX includes
    in FIVE new sectors -- payments (k-reg-16 V neg 2024-09 / k-reg-17 COF pos
    2025-04, a temporally-separated crossed-sign pair), tech (k-reg-18 AAPL neg
