# Phase-K regulation sourcing funnel — FROZEN pre-registration artifact.
#
# WHAT THIS IS
# -----------
# The frozen result of the M2 source-anchored REGULATION sourcing pass: 15
# CONSIDERED candidates, of which 10 are marked include_in_validation and 5 are
# flagged/excluded with reasons.  This is the THIRD mechanism family in the
# Phase-K program (after tariff and sanction) and is the designated
# CROSSED-SIGN family whose job is to break the tariff(+)/sanction(-)
# family-sign confound documented in stats/PHASE_K_EVIDENCE.md §7.  This is a
# SOURCING FUNNEL and an anti-cherry-pick pre-registration record — it is
# frozen BEFORE any return check, event-study validation, price backfill, or
# curated_observation promotion.
#
# WHAT THIS IS NOT
# ----------------
# * NOT a validated cohort, and NOT a pooled/FDR/significance claim.  No return
#   was checked before this freeze; cohort_ready is false.
# * NOT a 15-event cohort.  Only 10 rows are clean single-name includes, and
#   they collapse to an estimated ~7-8 EFFECTIVE independent shocks (three
#   sectors carry a temporally-separated crossed-sign pair, and a Spring-2024
#   window cluster overlaps four reads).  That is AT/NEAR the n>=8 floor in
#   stats/METHODOLOGY.md, not comfortably above it.
# * NOT first-order regulatory evidence.  Per the M1 scope decision this family
#   is SECOND-ORDER only: the regulator acts on the firm's competitive /
#   prudential / pricing environment and the market prices the DOWNSTREAM
#   consequence.  First-order events — FDA product approvals/CRLs and pure
#   merger-arb deal-spread reads on a target — are EXCLUDED on purpose and kept
#   visible as k-reg-14 / k-reg-15 so the scope boundary is auditable.
# * NOT source-checked.  This freeze was authored without network access, so
#   every event_date and source_url below is high-confidence MODEL RECALL, not
#   confirmed against the official document (see DATE CONVENTION).  All rows are
#   date_anchor: estimated and must be pinned — and possibly re-anchored —
#   before any validation.
# * NOT part of the closed Phase 1 / Phase 2 evidence FDR pools, and NOT an
#   entry in examples/selection_funnel_ledger.yaml.  Kept in a SEPARATE file to
#   avoid conflating open pre-validation sourcing with the closed pool.
#   Nothing reads this file yet; it is a tracked audit artifact.
#
# DATE CONVENTION (per row)
# -------------------------
#   source_url   = the official PROVENANCE document or newsroom page (Fed / OCC
#                  / FDIC / CFPB / CMS / EPA / FERC / FCC / DOJ / FTC / Federal
#                  Register / the court docket for an injunction or ruling).
#   event_date   = the date the MARKET first learned the operative news (the
#                  news-break / first market-learnable date), which is often
#                  the proposal, the ruling, or the rate-notice release — NOT a
#                  later effective date.
#   date_anchor  = "estimated" for EVERY row in this freeze.  This artifact was
#                  authored WITHOUT network access, so NO date and NO source_url
#                  below was checked against its official source — all are
#                  high-confidence MODEL RECALL.  This is a deliberately weaker
#                  guarantee than the sibling tariff/sanction funnels, where
#                  "verified" meant checked against the USTR / Federal-Register
#                  document; to avoid silently re-using that word for recall, NO
#                  row here is marked "verified".  Before ANY validation, every
#                  row's event_date, intraday timing, and source_url MUST be
#                  pinned against the official source — and the date may be
#                  RE-ANCHORED (not merely confirmed) if the market-moving
#                  document turns out to be a different release than the one
#                  recalled here.
#
# mechanism_family is the canonical FAMILY_IDS value "regulation" for every row
# (mechanism_family.py: "regulation" = antitrust / merger block / capital rules
# / disclosure / company-specific regulatory action, distinct from the broad
# "policy_surprise" central-bank family).
#
# Frozen at: 2026-06-04 (authoring date; git records the commit time).
# Upstream: M1 third-family selection (regulation, second-order scope).

phase: K
mechanism_family: regulation
frozen_at: "2026-06-04"

# ---------------------------------------------------------------------------
# Funnel summary
# ---------------------------------------------------------------------------
funnel_summary:
  considered: 15
  included_for_validation: 10
  excluded_or_flagged: 5
  direction_mix_included: "5 positive / 5 negative"
  effective_independent_n_estimate: "~7-8 (at the n>=8 floor, not above it)"
  cohort_ready: false
  conclusion: >-
    Regulation is a genuinely CROSSED-SIGN second-order family: the same
    mechanism produces clean positives (prudential relief, a vacated fee rule,
    antitrust-block relief for an acquirer, a proposed rule repeal) and clean
    negatives (a tougher capital proposal, a fee cap, a drug-price-negotiation
    listing, a stricter emissions rule, a reimbursement-rate cut) on
    well-defined single-name US-listed tickers across SEVEN distinct sectors.
    That breaks the one-sector-collapse failure of the tariff funnel (steel)
    and of a supply_shock funnel (this codebase's _ticker_sector folds all
    commodities into ONE channel).  BUT three caveats keep cohort_ready false
    and the effective N only ~7-8: (1) three sectors (banking, consumer
    finance, coal/power) each carry a temporally-separated crossed-sign PAIR,
    so they are ~1.5 effective shocks apiece, not 2; (2) four 2024 reads
    (Mar-May: consumer-finance, managed-care, coal, consumer-finance) have
    OVERLAPPING 20-day forward windows — cross-sector and idiosyncratic, so
    weakly correlated, but not fully independent; (3) several dates are
    ESTIMATED and must be pinned.  FIRST-ORDER vs SECOND-ORDER coherence: this
    funnel is scoped so every included read is the market pricing a DOWNSTREAM
    consequence (future ROE / fee revenue / Medicare revenue / coal demand /
    reimbursement margin / competitive structure), the SAME kind of read as
    tariff (a competitor's cost change) and sanction (a supplier's access
    change).  The mechanically-priced first-order cases a skeptic would attack
    — FDA product approvals and merger-arb target spreads — are EXCLUDED on
    purpose (k-reg-14, k-reg-15) so they cannot prop up a hit rate.  Resolve
    before any cohort FDR via one of: (a) pin all estimated dates and confirm
    no window double-counts the Spring-2024 cluster; (b) source a few more
    temporally-ISOLATED regulation events (ideally pre-2023) to lift effective
    N clear of 8; (c) sector-relative benchmarks per included row while
    accepting the low effective N.

# Independence-span coverage of the 15-row batch (documentation only).
independence_span:
  sub_channels:
    - bank_capital_rule           # Basel III endgame proposal / softening
    - consumer_finance_fee_rule   # CFPB late-fee rule + its court injunction
    - drug_price_regulation       # IRA Medicare negotiation (NOT FDA approval)
    - power_plant_emissions_rule  # EPA GHG rule + proposed repeal
    - medicare_advantage_rate     # CMS MA final rate notice
    - antitrust_merger_block      # JetBlue-Spirit, Kroger-Albertsons (acquirer read)
    - antitrust_monopolization    # excluded this round (contaminated / first-order)
  sectors:        [banking, consumer_finance, pharma, coal_power, managed_care, grocery, airlines]
  distinct_years: [2023, 2024, 2025]
  direction_mix:  "included 5 positive / 5 negative (balanced by design)"
  include_only_subset:
    sectors:        [banking, consumer_finance, pharma, coal_power, managed_care, grocery, airlines]
    distinct_years: [2023, 2024, 2025]
    note: >-
      Seven distinct sectors, far less concentrated than tariff (steel-dominated)
      or supply_shock (one commodities channel).  But banking, consumer finance,
      and coal/power each appear TWICE as a temporally-separated crossed-sign
      pair (sharing a sector factor), and four of the ten reads fall in a
      Mar-May 2024 window cluster with overlapping forward windows — so the
      effective independent N is ~7-8, not 10.

# ---------------------------------------------------------------------------
# Anti-cherry-pick statement (binding)
# ---------------------------------------------------------------------------
anti_cherry_pick:
  - "No return checks, event-study validation, or price-cache backfill were run before this freeze."
  - "No curated_observation promotion was performed; this file changes no DB row and no report output."
  - "No candidate may be replaced, re-dated, or re-classified after returns are checked; corrections (if any) must be added as NEW, separately-counted entries, never silent edits."
  - "Excluded/flagged candidates remain visible in this file (include_in_validation: false) and are never deleted, so the full denominator stays auditable."
  - "EVERY row is date_anchor: estimated: this freeze was authored without network access, so all dates and source_urls are high-confidence model recall, not source-checked. Each row's event_date, intraday timing, and source_url must be pinned to the official source — and the date re-anchored if a different release moved the tape — before that row is validated; an unpinned row is not cohort-eligible."
  - "The closed Phase 1 / Phase 2 evidence FDR pools are untouched and unreferenced; this is open pre-validation sourcing, a separate scope."
  - "Regulation cohort inference is BLOCKED until effective independent N clears 8 (pin dates + add temporally-isolated events, or adopt sector-relative benchmarks); the current estimate (~7-8) is at the floor, not above it."

