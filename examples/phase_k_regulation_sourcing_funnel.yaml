# ---------------------------------------------------------------------------
# Anti-cherry-pick statement (binding)
# ---------------------------------------------------------------------------
anti_cherry_pick:
  - "No return checks, event-study validation, or price-cache backfill were run before this freeze."
  - "No curated_observation promotion was performed; this file changes no DB row and no report output."
  - "No candidate may be replaced, re-dated, or re-classified after returns are checked; corrections (if any) must be added as NEW, separately-counted entries, never silent edits."
  - "Excluded/flagged candidates remain visible in this file (include_in_validation: false) and are never deleted, so the full denominator stays auditable."
  - "M3 (2026-06-04) source-verified every datable event against its official primary source: all 13 dates were confirmed (no recalled date was wrong); the 9 includes and the confirmed-date excludes are now date_anchor: verified. STILL OPEN before validation: first_trading_date / intraday timing on the court-ruling and release rows, and a few exact source_url deep-links."
  - "k-reg-10 / HUM was reclassified from included to excluded by SOURCE VERIFICATION ONLY (a clean-anchor / window-contamination judgment), before any returns were checked, and is kept visible. NO replacement candidate was added — the included count simply fell 10 -> 9."
  - "M5 (2026-06-04) sourced 8 additional candidates (k-reg-16..23) by OFFICIAL-SOURCE research only — no returns checked; every event_date was web-confirmed against the official source. All 8 are kept visible: 6 includes (4 core + 2 secondary/flagged) and 2 excluded (k-reg-22 EQT commodities-factor overlap, k-reg-23 CP-KCS foreign-acquirer/first-order-target). NO existing row was altered or replaced; the M5 rows are appended, separately counted."
  - "The closed Phase 1 / Phase 2 evidence FDR pools are untouched and unreferenced; this is open pre-validation sourcing, a separate scope."
  - "Regulation cohort inference remains BLOCKED until the post-M5 effective N (~8-10, about 8 on the core four at the conservative low end) is CONFIRMED by resolving the TLN/COF timing pins and the per-row h1-macro flags; cohort_ready stays false. No returns, event-study, backfill, or promotion have been run."

