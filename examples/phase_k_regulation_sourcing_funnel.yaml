  excluded_or_flagged: 14             # M11: +2 (k-reg-28 MSFT, k-reg-29 COIN)
  direction_mix_included: "6 positive / 9 negative"   # M11: +2 pos (TMUS/WFC), +2 neg (BX/PYPL)
  core_new_additions: "k-reg-16 V + k-reg-18 AAPL SURVIVE; k-reg-17 COF + k-reg-19 TLN EXCLUDED (M7 macro-contaminated)"
  secondary_flagged_additions: "k-reg-20 LYV kept (re-anchored); k-reg-21 HOOD EXCLUDED (FOMC-day)"
