    sectors:        [banking, consumer_finance, pharma, coal_power, grocery, airlines, payments, tech, independent_power, entertainment, brokers]
    distinct_years: [2022, 2023, 2024, 2025]
    note: >-
      ELEVEN distinct sectors after the M5 additions (was six).  The CORE FOUR
      M5 adds carry the effective-N lift: payments (k-reg-16 V + k-reg-17 COF,
      a temporally-separated crossed-sign pair), tech (k-reg-18 AAPL),
