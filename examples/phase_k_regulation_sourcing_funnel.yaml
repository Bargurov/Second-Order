# Phase-K regulation sourcing funnel — FROZEN pre-registration artifact.
#
# WHAT THIS IS
# -----------
# The M2 source-anchored REGULATION sourcing pass: 15 CONSIDERED candidates.
# After the M3 official-source verification, 9 are marked include_in_validation
# and 6 are flagged/excluded with reasons (M3 reclassified k-reg-10 / HUM from
# included to excluded by source check — see its row).  This is the THIRD family in the
# Phase-K program (after tariff and sanction) and is the designated
# CROSSED-SIGN family whose job is to break the tariff(+)/sanction(-)
# family-sign confound documented in stats/PHASE_K_EVIDENCE.md §7.  This is a
# SOURCING FUNNEL and an anti-cherry-pick pre-registration record — it is
# frozen BEFORE any return check, event-study validation, price backfill, or
# curated_observation promotion.
#
# WHAT THIS IS NOT
# ----------------
# * NOT a validated cohort, and NOT a pooled/FDR/significance claim.  No return
#   was checked before this freeze; cohort_ready is false.
# * NOT a 23-event cohort.  After M7, 12 of the 23 considered rows are includes
#   across NINE sectors; the estimated effective N is ~8 (AT the n>=8 floor in
#   stats/METHODOLOGY.md, NOT above), conditional on the §3 re-anchors (esp. the
#   JBLU sign-flip), the KR 2024-12-10 ruling-time pin, and per-row h1 macro
#   cleanliness -- so cohort_ready stays false.
#   (Lineage: M3 = 9 includes / ~6 effective; M5 added six fresh-sector includes
#   toward ~8-10; M7's timing/macro audit re-anchored 10 intraday rows and
#   EXCLUDED COF/TLN/HOOD as macro-contaminated, removing the optimistic ~10 and
#   settling at ~8.)
# * NOT first-order regulatory evidence.  Per the M1 scope decision this family
#   is SECOND-ORDER only: the regulator acts on the firm's competitive /
#   prudential / pricing environment and the market prices the DOWNSTREAM
#   consequence.  First-order events — FDA product approvals/CRLs and pure
#   merger-arb deal-spread reads on a target — are EXCLUDED on purpose and kept
#   visible as k-reg-14 / k-reg-15 so the scope boundary is auditable.
# * M3 SOURCE-PIN STATUS.  The M2 freeze was authored without network access
#   (model recall).  M3 then checked every datable event against its official
#   primary source: all 13 dates were CONFIRMED — no recalled date was wrong.
#   The 9 includes (and the confirmed-date excludes k-reg-07/12/13) are now
#   date_anchor: verified.  STILL OPEN: first_trading_date / intraday
#   announcement timing for the court-ruling and release rows, and a few exact
#   source_url deep-links.  NO returns were checked at any stage.
# * NOT part of the closed Phase 1 / Phase 2 evidence FDR pools, and NOT an
#   entry in examples/selection_funnel_ledger.yaml.  Kept in a SEPARATE file to
#   avoid conflating open pre-validation sourcing with the closed pool.
#   Nothing reads this file yet; it is a tracked audit artifact.
#
# DATE CONVENTION (per row)
# -------------------------
#   source_url   = the official PROVENANCE document or newsroom page (Fed / OCC
#                  / FDIC / CFPB / CMS / EPA / FERC / FCC / DOJ / FTC / Federal
#                  Register / the court docket for an injunction or ruling).
#   NEWS-BREAK   = the date the MARKET first learned the operative news (the
#                  proposal / ruling / rate-notice release).  This is the
#                  source-confirmed date; for re-anchored rows it lives in
#                  operator_notes (labelled NEWS-BREAK).
#   event_date   = the EVENT-STUDY ENGINE ANCHOR.  TWO conventions coexist after
#                  the M7 audit, so read it per row:
#                    (a) RE-ANCHORED intraday/morning rows (GS, JPM, SYF, BMY,
#                        BTU/06, JBLU, BTU/11, V, AAPL, LYV): event_date = the
#                        §3 prior trading close before the first priceable
#                        session, DERIVED FROM the source-confirmed NEWS-BREAK in
#                        notes, so h1 (event_date close -> news-break close)
#                        captures the reaction;
#                    (b) TIMING-UNRESOLVED court rows (BFH/04, KR/08): event_date
#                        still holds the NEWS-BREAK date pending the
#                        intraday-vs-after-close pin -- it will be re-anchored in
#                        a later gate once the ruling time is known.
#   date_anchor  = "verified" attests the NEWS-BREAK event/date was confirmed
#                  against the official primary source (M3/M5) -- NOT that the
#                  event_date cell is itself source-stamped; for re-anchored rows
#                  the anchor is DERIVED from that verified news-break per §3.
#                  "estimated" remains ONLY for k-reg-10 (anchor unresolved) and
#                  the scope-example rows k-reg-14 / k-reg-15 (no datable event).
#                  first_trading_date = the first priceable session (the
#                  news-break trading day); still to be pinned where the
#                  intraday timing is open (BFH/04, KR/08).  No returns were used
#                  to choose or confirm any date.
#
# mechanism_family is the canonical FAMILY_IDS value "regulation" for every row
# (mechanism_family.py: "regulation" = antitrust / merger block / capital rules
# / disclosure / company-specific regulatory action, distinct from the broad
# "policy_surprise" central-bank family).
#
# Frozen at: 2026-06-04 (authoring date; git records the commit time).
# Upstream: M1 third-family selection (regulation, second-order scope).

phase: K
mechanism_family: regulation
frozen_at: "2026-06-04"

# ---------------------------------------------------------------------------
# Funnel summary
# ---------------------------------------------------------------------------
funnel_summary:
  considered: 23                      # unchanged
  included_for_validation: 12         # M7: was 15; -3 (COF/TLN/HOOD macro-contaminated)
  excluded_or_flagged: 11             # M7: was 8; +3
  direction_mix_included: "5 positive / 7 negative"   # M7: lost COF(+), TLN(-), HOOD(-)
  core_new_additions: "k-reg-16 V + k-reg-18 AAPL SURVIVE M7; k-reg-17 COF + k-reg-19 TLN EXCLUDED (macro-contaminated)"
  secondary_flagged_additions: "k-reg-20 LYV kept (re-anchored); k-reg-21 HOOD EXCLUDED (FOMC-day)"
  effective_independent_n_estimate: "~8 (AT the n>=8 floor, not above; conditional on the §3 re-anchors -- esp. JBLU sign-flip -- the KR 2024-12-10 timing, and per-row h1 macro cleanliness)"
  cohort_ready: false                 # near the floor; re-anchors + KR timing + h1-macro confirmation still pending
  conclusion: >-
    Regulation is a genuinely CROSSED-SIGN second-order family: the same
    mechanism produces clean positives (prudential relief, a vacated fee rule,
    antitrust-block relief for an acquirer, a proposed rule repeal) and clean
    negatives (a tougher capital proposal, a fee cap, a drug-price-negotiation
    listing, a stricter emissions rule) on well-defined single-name US-listed
    tickers across six distinct sectors (the M3 state; M5 lifted this to eleven,
    M7 trimmed it back to nine -- see the M5/M7 UPDATEs below).  That breaks the
    one-sector-collapse
    failure of the tariff funnel (steel) and of a supply_shock funnel (this
    codebase's _ticker_sector folds all commodities into ONE channel).  M3
    official-source verification CONFIRMED all 13 datable event dates (no recalled
    date was wrong) but moved the effective N DOWN, not up: (1) k-reg-10 / HUM
    was reclassified to excluded because no single CMS rate notice gives a clean,
    correctly-signed read (the Jan-31 Advance Notice window is contaminated by
    Humana's Jan-25 non-regulatory guidance withdrawal; the ~Apr-1 Final Notice
    is not cleanly negative versus the Advance baseline) -- a source/sourcing
    judgment, no returns used; (2) three sectors (banking, consumer finance,
    coal/power) each carry a temporally-separated crossed-sign PAIR, so they are
    ~1.5 effective shocks apiece, not 2; (3) a Spring-2024 cluster (k-reg-03
    consumer-finance, k-reg-06 coal, k-reg-04 consumer-finance) still has
    overlapping 20-day windows; (4) MACRO PROXIMITY: several included event/h1
    windows straddle a macro print (k-reg-01 GDP/PCE, k-reg-02 CPI + Sep FOMC,
    k-reg-06 Q1-GDP/PCE, k-reg-08 CPI, k-reg-11 CPI) -> read h1-only per
    PHASE_K_EVIDENCE §6 and confirm h1 is clean of same-day macro at validation.
    So at the M3 state the effective N was ~6, BELOW the n>=8 floor (M5 then
    lifted it -- see the M5 UPDATE below).  POSITIVE-LEG ASYMMETRY: ALL FIVE
    positives are relief / reversal reads -- regulatory-relief (JPM softening,
    BFH injunction, BTU proposed repeal) or acquirer-relief (KR, JBLU); there is
    NO pure "a regulator acted to directly help this name" positive in the set,
    and the 2 acquirer-relief reads (KR, JBLU) additionally rest on a contestable
    direction.  Kept as flagged includes, but a pooled read inherits this
    asymmetry.
    FIRST-ORDER vs SECOND-ORDER coherence: every included read is the market
    pricing a DOWNSTREAM consequence (future ROE / fee revenue / Medicare revenue
    / coal demand / competitive structure), the SAME kind of read as tariff (a
    competitor's cost change) and sanction (a supplier's access change); the
    mechanically-priced first-order cases — FDA product approvals and merger-arb
    target spreads — are EXCLUDED on purpose (k-reg-14, k-reg-15).  Resolve
    before any cohort FDR via one of: (a) pin the remaining first_trading_date /
    intraday timings and confirm each h1 is macro-clean; (b) source a few more
    temporally-ISOLATED regulation events (ideally pre-2023) to lift effective N
    clear of 8; (c) sector-relative benchmarks per included row while accepting
    the low effective N.
    M5 UPDATE (2026-06-04, read-only official-source sourcing): added SIX includes
    in FIVE new sectors -- payments (k-reg-16 V neg 2024-09 / k-reg-17 COF pos
    2025-04, a temporally-separated crossed-sign pair), tech (k-reg-18 AAPL neg
    2024-03), independent-power (k-reg-19 TLN neg 2024-11), entertainment
    (k-reg-20 LYV neg, secondary), brokers (k-reg-21 HOOD neg 2022-12, secondary)
    -- plus two excluded-but-visible (k-reg-22 EQT, folds into the commodities
    factor with BTU; k-reg-23 CP-KCS, foreign acquirer + first-order US target).
    The CORE FOUR (V, COF, AAPL, TLN) carry the lift: V is the cleanest (off
    cluster, mild macro); COF is the only NON-relief positive but its first
    session is 2025-04-21 (Apr-18 was Good Friday, markets closed) on a
    tariff-volatile tape; AAPL is Spring-cluster-adjacent and the day after the
    3/20 FOMC; TLN is the most contaminated (2024-11-01 = NFP/jobs day, election/
    FOMC week).  So the estimate rises from ~6 to ~8-10 -- about 8 (AT the floor)
    on the core four with TLN/COF timing-discounted and the two secondaries set
    aside, up to ~10 only if all clear -- BUT cohort_ready stays FALSE until the
    TLN/COF timing pins and per-row h1-macro cleanliness are resolved.  HONEST DIRECTION TILT: the included set is now 6
    positive / 9 negative -- clean regulation reads skew negative (regulation
    mostly constrains), and a clean NON-relief positive remains scarce (COF is
    the only one).  No existing row was altered; all M5 candidates are kept
    visible.
    M7 UPDATE (2026-06-04, read-only timing/macro audit -- no returns): the
    funnel's event_date = announcement-date convention was WRONG for
    intraday/morning announcements -- per PHASE_K_EVIDENCE §3 the engine must
    anchor to the PRIOR trading close so h1 captures the reaction.  TEN rows
    RE-ANCHORED (GS, JPM, SYF, BMY, BTU/06, JBLU, BTU/11, V, AAPL, LYV), with the
    news-break date kept per row; JBLU was the sharpest case -- a mis-anchor would
    have measured its 01-17 give-back and FLIPPED the sign.  THREE rows EXCLUDED
    as macro-contaminated on the first priceable session: COF (2025-04-21 =
    market-wide Trump-vs-Powell selloff; 04-18 was Good Friday), TLN (2024-11-01 =
    October NFP miss, election/FOMC week), HOOD (2022-12-14 = FOMC 50bp day).  KR
    stays included but TIMING-CRITICAL (a late-afternoon 12-10 ruling would put h1
    on the 12-11 CPI -> pin or re-anchor).  This REMOVES the optimistic ~10: the
    surviving lift over the M3 ~6 is V (clean) + AAPL (macro-adjacent-usable), so
    effective N is ~8 -- AT the n>=8 floor, NOT above -- and only if the §3
    re-anchors and the KR timing hold.  cohort_ready stays FALSE.

