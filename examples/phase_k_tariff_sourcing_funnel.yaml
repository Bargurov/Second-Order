# Phase-K tariff sourcing funnel — FROZEN pre-registration artifact.
#
# WHAT THIS IS
# -----------
# The frozen result of the K4 source-anchored tariff/trade-policy sourcing
# pass: 15 CONSIDERED candidates, of which 6 are marked include_in_validation
# and 9 are flagged/excluded with reasons.  This is a SOURCING FUNNEL and an
# anti-cherry-pick pre-registration record — it is frozen BEFORE any return
# check, event-study validation, price backfill, or curated_observation
# promotion.
#
# WHAT THIS IS NOT
# ----------------
# * NOT a 15-event validation cohort.  Only 6 rows are clean single-name
#   includes, and they collapse to ~3-4 EFFECTIVE independent sector-shocks
#   (steel x4 temporally-independent but one sector factor; appliances x1;
#   solar x1; ticker X repeats).  That is below the METHODOLOGY n>=8
#   independent-shock floor, so a tariff-only cohort is NOT cohort-ready.
# * NOT part of the closed Phase 1 / Phase 2 evidence FDR pools, and NOT an
#   entry in examples/selection_funnel_ledger.yaml.  That ledger is the v2
#   cohort's validation-OUTCOME record (gate_stage / outcome / result_code =
#   PASS/FAIL for the closed WHR/CENX/FSLR/TXT/RIO pool) and is consumed by
#   scripts/selection_funnel_summary.py against fixed v2 expectations.  This
#   Phase-K funnel is kept in a SEPARATE file to avoid conflating open
#   pre-validation sourcing with the closed pool and to avoid breaking that
#   consumer.  Nothing reads this file yet; it is a tracked audit artifact.
#
# DATE CONVENTION (per row)
# -------------------------
#   source_url   = the official PROVENANCE document (USTR / Federal Register /
#                  White House / Commerce / USITC).
#   event_date   = the date the MARKET first learned the operative news
#                  (the news-break), which is often EARLIER than the
#                  proclamation / final-determination document date.  AD/CVD
#                  surprise is normally the PRELIMINARY determination; a
#                  proclamation's surprise is normally the ANNOUNCEMENT OF
#                  INTENT, not the signing.  (Exception: k-tar-02, where the
#                  preliminary was negative and the FINAL reversed it -> the
#                  final is the surprise.)
#   date_anchor  = "verified" (date confirmed against official source) or
#                  "estimated" (must be pinned before any validation).
#
# mechanism_family is the canonical FAMILY_IDS value "tariff" for every row
# (NOT the older "tariffs_industrial_policy" string used in v2 prose).
#
# Frozen at: 2026-06-04 (authoring date; git records the commit time).
# Upstream: brainstorming K1 (tariff-first), K2/K3 (curated_observation path).

phase: K
mechanism_family: tariff
frozen_at: "2026-06-04"

# ---------------------------------------------------------------------------
# Funnel summary
# ---------------------------------------------------------------------------
funnel_summary:
  considered: 15
  included_for_validation: 6
  excluded_or_flagged: 9
  effective_independent_n_estimate: "~3-4"
  cohort_ready: false
  conclusion: >-
    Tariff-only cohort inference is NOT ready.  Clean single-name tariff
    includes are scarce and steel-concentrated: the 6 includes are steel x4
    (X-2002, X-2014, STLD-2015, NUE-2018; temporally independent but one
    sector factor, ticker X repeated), appliances x1 (WHR-2018), solar x1
    (FSLR-2024) -> ~3-4 effective independent sector-shocks, below the n>=8
    floor in stats/METHODOLOGY.md.  The clean-single-name constraint
    collapses the nominal authority/administration/industry/year diversity
    back into steel.  Resolve before any cohort FDR via one of: (a) sector-
    relative benchmarks (XME/SLX/TAN/XLY) per the closed cohort while
    accepting low effective-N; (b) a future non-steel clean batch; or
    (c) broadening to a mixed-mechanism family cohort.

# Independence-span coverage of the 15-row batch (documentation only).
independence_span:
  legal_authorities: [section_201, section_232, section_301, ad_cvd, section_421]
  administrations:    [bush, obama, trump_1, biden, trump_2]
  industries:         [steel, appliances, solar, aluminum, tires, lumber, paper, energy_tubular]
  distinct_years:     [2002, 2009, 2012, 2014, 2015, 2017, 2018, 2024, 2025]
  include_only_subset:
    legal_authorities: [section_201, section_232, section_301, ad_cvd]
    administrations:    [bush, obama, trump_1, biden]
    industries:         [steel, appliances, solar]
    distinct_years:     [2002, 2014, 2015, 2018, 2024]
    note: >-
      Spans the matrix nominally, but the include set is steel-dominated
      (4 of 6) and effective independent N is ~3-4 sector-shocks, not 6.

# ---------------------------------------------------------------------------
# Anti-cherry-pick statement (binding)
# ---------------------------------------------------------------------------
anti_cherry_pick:
  - "No return checks, event-study validation, or price-cache backfill were run before this freeze."
  - "No candidate may be replaced, re-dated, or re-classified after returns are checked; corrections (if any) must be added as NEW, separately-counted entries, never silent edits."
  - "Excluded/flagged candidates remain visible in this file (include_in_validation: false) and are never deleted, so the full denominator stays auditable."
  - "Tariff-only cohort inference is BLOCKED until more independent, clean, single-name tariff events are sourced (or a sector-relative / mixed-family construction is adopted); effective independent N (~3-4) is below the n>=8 floor."

