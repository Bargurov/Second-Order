# Selection funnel ledger for the v2 cohort workstream.
#
# Each entry is one distinct candidate consideration. Corrected
# re-pre-registrations (CENX-Apr9, TXT-Dec6, RIO-Jan25) appear as
# separate entries from their failed originals (CENX-Apr6, TXT-Dec5,
# RIO-Jan28) so each temp-validation run is counted exactly once.
#
# Vocabularies:
#
#   gate_stage:
#     planning              — never advanced past planning
#     date_sanity           — rejected at source-date sanity gate
#     provider_preview      — failed provider preview gate (delisted, etc.)
#     temp_validation       — was tested via in-memory event study
#     corrected_validation  — re-ran after correction of a temp_validation failure
#     accepted_v2           — in the v2 cohort (carryover that did not re-validate
#                             in this workstream)
#
#   outcome:
#     accepted                    — in the final v2 cohort
#     rejected                    — out, will not be re-considered as-is
#     blocked                     — provider/delisting issue; row is unreachable
#     backup                      — held in queue; not in v2 but defensible
#     corrected_original_failed   — failed original of a row later corrected
#                                   and accepted; included for honest disclosure
#
#   result_code (validation runs only; "N/A" for rows that never ran):
#     PASS               — validation cleared p<0.05 in pre-registered direction
#     FAIL_WRONG_SIGN    — validation produced wrong-sign result
#     FAIL_DATE_ERROR    — first_trading_date was wrong; corrected version re-run
#     N/A                — row was rejected before validation
#
# Consumed by: scripts/selection_funnel_summary.py
# Not consumed by any other live pipeline; this is an operator audit trail.

