# Phase-K sanction sourcing funnel — FROZEN pre-registration artifact.
#
# WHAT THIS IS
# -----------
# The frozen result of the K7 source-anchored sanction-family sourcing pass:
# 15 CONSIDERED candidates, of which 5 are marked include_in_validation and
# 10 are flagged/excluded with reasons.  Sibling to
# examples/phase_k_tariff_sourcing_funnel.yaml (K5).  Frozen BEFORE any return
# check, event-study validation, price backfill, or curated_observation
# promotion.  An anti-cherry-pick pre-registration record.
#
# WHAT THIS IS NOT
# ----------------
# * NOT a 15-event validation cohort, and NOT a finished cohort on its own.
# * NOT an entry in examples/selection_funnel_ledger.yaml (the CLOSED v2 /
#   Phase 1-2 pool's validation-OUTCOME record).  Kept in a SEPARATE file to
#   avoid conflating open pre-validation sourcing with the closed pool and to
#   avoid breaking scripts/selection_funnel_summary.py.  Nothing reads this
#   file yet; it is a tracked audit artifact.
#
# COMBINED COUNT (with the K5 tariff funnel)
# ------------------------------------------
# By the independence criterion frozen in stats/METHODOLOGY.md (distinct
# underlying events with DISTINCT DATES / NON-OVERLAPPING forward windows),
# the 6 tariff includes (K5) + the 5 sanction includes here = ~9-11 distinct
# non-overlapping shocks spanning 2002-2024 -> the cohort COUNT FLOOR (n>=8)
# is plausibly CLEARED.  The cross-sectional correlation that would inflate
# the cohort z-test comes from OVERLAPPING WINDOWS, which these temporally-
# dispersed events do not have; so a same-sector "effective-N" collapse is the
# wrong lens here.  The binding open issue is NOT count -- it is MECHANISM /
# SIGN CONCENTRATION (see caveats) -- and it is a K9 cohort-design question
# (benchmark choice + sign-oriented testing + a new FDR scope), not something
# sourcing settles.
#
# DATE CONVENTION (per row)
# -------------------------
#   source_url  = the official PROVENANCE document (OFAC/Treasury, BIS/Commerce,
#                 Federal Register, White House, or the company's SEC 8-K where
#                 that is the public news-break).
#   event_date  = the date the MARKET first learned the operative news.
#   date_anchor = "verified" (confirmed against official source) or
#                 "estimated" (pin before any validation).
#
# mechanism_family is the canonical FAMILY_IDS value "sanction" for every row.
# Export controls are NOT a separate family -- they are mechanism_subtype
# "tech_sanction".  Subtypes used: oil_sanction / tech_sanction /
# financial_sanction (from FAMILY_SUBTYPES['sanction']).
#
# Frozen at: 2026-06-04 (authoring date; git records the commit time).
# Upstream: K6 (sanction = next family), K7 (this sourcing pass).

phase: K
mechanism_family: sanction
frozen_at: "2026-06-04"

# ---------------------------------------------------------------------------
# Funnel summary
# ---------------------------------------------------------------------------
funnel_summary:
  considered: 15
  included_for_validation: 5
  excluded_or_flagged: 10
  combined_tariff_plus_sanction_window_independent_estimate: "~9-11"
  cohort_count_floor: "plausibly clears n>=8"
  cohort_ready: provisional
  conclusion: >-
    Combined with the 6 frozen tariff includes (K5), the 5 sanction includes
    here give ~9-11 distinct, non-overlapping shocks (2002-2024) -> the n>=8
    COUNT floor is plausibly cleared.  But cohort readiness is PROVISIONAL:
    the includes carry a mechanism/sign concentration that cohort design must
    resolve before any inference (see caveats).  No returns were checked; no
    FDR scope exists.

# Independence-span coverage of the 15-row sanction batch (documentation only).
independence_span:
  legal_bases:        [ofac_treasury, bis_commerce_entity_list, executive_order, statute]
  subtypes:           [tech_sanction, oil_sanction, financial_sanction]
  administrations:    [trump_1, trump_2, biden, obama]
  sectors:            [semiconductors, energy_refining, metals_aluminum, nuclear_fuel, banking]
  distinct_years:     [2018, 2019, 2020, 2022, 2023, 2024]
  include_only_subset:
    subtypes:        [tech_sanction, oil_sanction]
    sectors:         [semiconductors, energy_refining]
    distinct_years:  [2018, 2019, 2020, 2022]
    note: >-
      The 5 includes are 4 tech_sanction (semis: ACIA-2018, QRVO-2019,
      LRCX-2020, NVDA-2022) + 1 oil_sanction (energy: PBF-2019).  Distinct
      dates / non-overlapping windows, so independent for the count; but 4/5
      are one export-control mechanism and all 5 are negative-direction.

# ---------------------------------------------------------------------------
# Caveats (binding — read before any cohort design)
# ---------------------------------------------------------------------------
caveats:
  - "ACIA (k-san-01) is PROVISIONAL: Acacia Communications was acquired by Cisco (2021) and delisted; per the K4 CLR/AGN finding, providers return empty frames for ALL historical windows of delisted names, so it may be UNCOMPUTABLE at data-time.  Optical-peer fallback (LITE / IIVI) is less ZTE-concentrated; or accept 4 robust sanction includes."
  - "The sanction includes are almost all NEGATIVE-direction (exposed US name harmed); only the excluded/positive rows (CENX, MU) point the other way."
  - "4 of 5 included sanctions are tech_sanction / export-control-loss (the same natural experiment 2018-2022) -> they are not 5 independent mechanisms; this is the real independence limit and is NOT fixed by benchmarking."
  - "Family confounds sign: every tariff include (K5) is positive, every sanction include here is negative -- a naive pooled test cannot separate 'mechanism' from 'direction'."
  - "DO NOT pool raw returns.  If cohort design proceeds, test SIGN-ORIENTED SAR per pre-registered direction."
  - "Sector-relative benchmark design is UNRESOLVED.  The coverage engine hardcodes SPY; the cohort/sensitivity layer needs a per-event sector benchmark (SMH/SOXX for semis, XLE/XOP for energy).  benchmark_ticker below is the proposed sector benchmark; SPY is the coverage-engine default."
  - "NO FDR scope exists yet.  Any cohort report must open a NEW self-contained (cohort, horizon) FDR scope, never merged with or compared against the closed Phase 1 / Phase 2 pools."

# ---------------------------------------------------------------------------
# Anti-cherry-pick statement (binding)
# ---------------------------------------------------------------------------
anti_cherry_pick:
  - "No return checks, event-study validation, or price-cache backfill were run before this freeze."
  - "No candidate may be replaced, re-dated, or re-classified after returns are checked; corrections (if any) must be added as NEW, separately-counted entries, never silent edits."
  - "Excluded/flagged candidates remain visible in this file (include_in_validation: false) and are never deleted, so the full denominator stays auditable."
  - "The closed Phase 1 / Phase 2 evidence FDR pools are untouched and must NOT be merged with this set.  The CENX/Rusal event (k-san-07) is excluded precisely because it already lives in the closed pool."

