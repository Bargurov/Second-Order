services:
  - type: web
    name: second-order-api
    runtime: python
    plan: starter
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      # Comma-separated list of origins allowed to call the API.
      # Leave blank for a same-origin deploy where the frontend is
      # served from the same host and /api/* is rewritten to this service.
      # Set to the deployed frontend origin(s) for split deploys.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Anthropic key - required for live analysis, optional locally.
      - key: ANTHROPIC_API_KEY
        sync: false
      # REQUIRED for a public deploy. Shared admin secret that guards the paid
      # /analyze endpoint and every mutating route (events / portfolio /
      # curated): when set, those routes require the X-Second-Order-Admin-Token
      # header. If left UNSET the guard is inert and those routes are
      # UNPROTECTED — never expose this service publicly without setting it.
      - key: SECOND_ORDER_ADMIN_TOKEN
        sync: false
      # Must be "true" (alongside SECOND_ORDER_ADMIN_TOKEN) to allow the paid
      # /analyze endpoint. Defaults to off, so /analyze stays blocked unless
      # paid analysis is explicitly enabled.
      - key: ENABLE_PAID_ANALYSIS
        sync: false
