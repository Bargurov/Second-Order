    source_type: regulator
    category: antitrust
    mechanism_family: regulation
    mechanism_summary: >-
      The FTC and 17 state attorneys general filed in the Western District of
      Washington alleging Amazon unlawfully maintains monopoly power in online
      superstore and marketplace-services markets. A structural-remedy antitrust
      complaint reprices the regulatory and breakup risk attached to the platform.
    affected_assets:
      - ticker: AMZN
