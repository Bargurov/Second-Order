# Z1A — Multi-regime expansion candidate pack (REVIEWABLE SOURCE INPUT, NOT INGESTED)
#
# Purpose: a source-backed, multi-regime shortlist to lift the corpus off its
# 2026-04/05 oil/war concentration. Every candidate is a real historical event
# with a verified primary-source URL. NOTHING here has been ingested, scored, or
# written to events.db / price_cache. review_status is candidate_only_not_ingested
# on every row; ingestion is a separate, operator-gated, DB-copy-first step (Z1B).
#
# Verification depth (honest log — Z1A built without DB/cache/provider/paid calls):
#   * Discovered via WebSearch restricted to the official domain (the search index
#     returns the canonical official-domain URL + a content summary).
#   * WebFetch full-content confirmed: bis.gov (Oct-2022, Oct-2023 rules) and the
#     Section 232 Federal Register proclamation (federalregister.gov).
#   * WebSearch-on-official-domain only (WebFetch returned HTTP 403 on these hosts,
#     i.e. the pages EXIST but block the fetch client): justice.gov, ftc.gov,
#     sec.gov, uaw.org, sagaftra.org, congress.gov, bidenwhitehouse.archives.gov.
#     Exact event dates for these were cross-checked against the official-domain
#     search summaries (e.g. the ftc.gov timeline item dated 2023-09-26).
#
# Distribution: 15 candidates / 5 canonical mechanism_family values
# (regulation, sanction, tariff, industrial_policy, labor_inflation) /
# 6 calendar years (2018, 2020, 2022, 2023, 2024, 2025) / 0 oil-complex / 0 from
# the 2026-04/05 cluster. Max month share = 2/15 (13%); max category share = 5/15
# (33%). Deferred on benchmark-defensibility grounds (NOT included): pure-rates /
# FOMC surprises (SPY is not a clean benchmark for a market-wide rate shock) and
# bank-stress epicenter names (SIVB/SBNY/FRC halted+delisted; survivors moved with
# a sector-wide panic, confounding AR-vs-SPY exactly like a rate shock).

candidates:
